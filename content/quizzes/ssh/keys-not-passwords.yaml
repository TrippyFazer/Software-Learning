id: ssh/keys-not-passwords
questions:
  - id: ssh-keys-q1
    type: multiple_choice
    concepts: [public-key, private-key]
    prompt: "Which file do you paste into a server's authorized_keys?"
    options:
      - id_ed25519 (the private key)
      - id_ed25519.pub (the public key)
      - known_hosts
      - Either one works
    answer_index: 1
    explanation: >
      Public key = the shareable lock; it GOES on servers. The private key
      never leaves your machine — pasting it anywhere burns it.

  - id: ssh-keys-q2
    type: multiple_choice
    concepts: [private-key]
    prompt: "During key login, what actually travels to the server?"
    options:
      - The private key, encrypted
      - A signature over a challenge — the private key itself is never transmitted
      - The passphrase
      - A hash of the private key
    answer_index: 1
    explanation: >
      The server sends a challenge; your client signs it; the server
      verifies with the stored public key. Nothing secret crosses the wire —
      that's the whole elegance of it.

  - id: ssh-keys-q3
    type: multiple_choice
    concepts: [known-hosts]
    prompt: "'REMOTE HOST IDENTIFICATION HAS CHANGED!' means…"
    options:
      - Your key expired
      - The server presents a different fingerprint than known_hosts remembers — often a rebuilt server, occasionally an impostor
      - Your password is wrong
      - Port 22 is closed
    answer_index: 1
    explanation: >
      known_hosts is trust in the other direction: your client remembering
      server identities. Rebuilt your Lightsail instance? Expected. Didn't?
      Stop and think.

  - id: ssh-keys-q4
    type: text
    concepts: [private-key, permission]
    prompt: "What numeric mode must a private key file have for SSH to accept it? (three digits)"
    accept: ["600"]
    explanation: >
      600 = rw------- : owner only. SSH refuses group/other-readable
      private keys with UNPROTECTED PRIVATE KEY FILE — Module 1's
      permissions doing real security work.

  - id: ssh-keys-q5
    type: multiple_choice
    concepts: [authorized-keys]
    prompt: "You want your new desktop to also SSH into your server (your laptop already can). What do you do?"
    options:
      - Copy the laptop's private key to the desktop
      - Generate a NEW pair on the desktop and append its .pub to the server's authorized_keys
      - Email yourself the laptop's key
      - Share the server's private key with the desktop
    answer_index: 1
    explanation: >
      Private keys don't travel — each machine gets its own pair, and
      authorized_keys is a list. Copying private keys between machines
      multiplies theft surface and ruins revocability.
