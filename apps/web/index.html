<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Learn Linux, networking, Docker and infrastructure from the ground up." />
    <title>Infrastructure Learning Lab</title>

    <!-- Installability. The manifest is what turns a page into something the
         operating system will give an icon and its own window. -->
    <!-- crossorigin="use-credentials" is REQUIRED here, not decorative.
         A manifest is fetched with credentials OMITTED by default. The site
         sits behind HTTP basic auth at the edge, so the default fetch gets a
         401, the manifest never loads, and the app is silently not
         installable — with no error anywhere the user would look. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores the manifest's icons entirely and uses this one. Without
         it, "Add to Home Screen" produces a blurry screenshot as the icon. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Learning Lab" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
